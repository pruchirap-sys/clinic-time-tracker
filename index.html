<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Clinic - Time Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        
        const BRANCHES = [
            { code: '001', name: 'แพรกษา' }, { code: '002', name: 'อโศก' },
            { code: '003', name: 'พระราม2' }, { code: '004', name: 'ลาดพร้าว' },
            { code: '005', name: 'รังสิต' }, { code: '006', name: 'ชลบุรี' },
            { code: '007', name: 'พิษณุโลก' }, { code: '008', name: 'ขอนแก่น' },
            { code: '009', name: 'พระราม9' }, { code: '010', name: 'โคราช' },
            { code: '011', name: 'ภูเก็ต' }
        ];

        const PROCEDURES = {
            'Botox': ['Check-in', 'คลีนซิ่ง', 'เตรียมผิว', 'ฉีด Botox', 'พักฟื้น', 'Check-out'],
            'Filler': ['Check-in', 'คลีนซิ่ง', 'ทา Numbing', 'พักรอ Numbing', 'ฉีด Filler', 'พักฟื้น', 'Check-out'],
            'Laser': ['Check-in', 'คลีนซิ่ง', 'เตรียมผิว', 'ยิงเลเซอร์', 'Cooling', 'Check-out'],
            'Thread Lift': ['Check-in', 'คลีนซิ่ง', 'Design', 'ทา Numbing', 'พักรอ Numbing', 'ยกกระชับ', 'พักฟื้น', 'Check-out'],
            'HIFU': ['Check-in', 'คลีนซิ่ง', 'Marking', 'ทำ HIFU', 'Cooling', 'Check-out'],
            'Meso Fat': ['Check-in', 'คลีนซิ่ง', 'ทา Numbing', 'พักรอ Numbing', 'ฉีด Meso', 'พักฟื้น', 'Check-out'],
            'IV Drip': ['Check-in', 'เจาะเลือด', 'ห้องพักผ่อน', 'เสร็จสิ้น', 'Check-out'],
        };

        const INITIAL_USERS = [
            { id: 1, username: 'admin', password: 'admin123', name: 'Admin', role: 'admin', status: 'active', allowedBranches: BRANCHES.map(b => b.code) },
            { id: 2, username: '10401', password: '268032', name: 'Ruchira', role: 'admin', status: 'active', allowedBranches: BRANCHES.map(b => b.code) },
            { id: 3, username: 'staff001', password: 'staff123', name: 'พนักงานสาขาแพรกษา', role: 'staff', status: 'active', allowedBranches: ['001'] }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(() => {
                const saved = localStorage.getItem('isLoggedIn');
                return saved === 'true';
            });
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('currentUser');
                return saved ? JSON.parse(saved) : null;
            });
            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('users');
                return saved ? JSON.parse(saved) : INITIAL_USERS;
            });
            
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [showUserMenu, setShowUserMenu] = useState(false);
            const [showUserModal, setShowUserModal] = useState(false);
            const [showAddForm, setShowAddForm] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            
            const [view, setView] = useState('dashboard');
            const [selectedBranch, setSelectedBranch] = useState('001');
            const [filterStatus, setFilterStatus] = useState('all');
            const [selectedDate, setSelectedDate] = useState(() => {
                const today = new Date();
                return today.toISOString().split('T')[0];
            });
            const [historyDate, setHistoryDate] = useState(new Date().toISOString().split('T')[0]);

            const [customers, setCustomers] = useState(() => {
                const saved = localStorage.getItem('customers');
                return saved ? JSON.parse(saved) : [
                    { hn: '0010000675', name: 'รุจิรา', phone: '0812345678', status: 'waiting', branch: '001', timestamp: '09:56', registeredAt: new Date().getTime(), sessions: [] }
                ];
            });
            
            const [regHN, setRegHN] = useState('');
            const [regName, setRegName] = useState('');
            const [regPhone, setRegPhone] = useState('');
            
            const [currentCustomer, setCurrentCustomer] = useState(null);
            const [procedure, setProcedure] = useState('');
            const [currentSessionIndex, setCurrentSessionIndex] = useState(0);
            const [sessions, setSessions] = useState([]);
            const [startTime, setStartTime] = useState(null);
            const [elapsedTime, setElapsedTime] = useState(0);
            const [note, setNote] = useState('');
            const [showAccidentModal, setShowAccidentModal] = useState(false);
            const [accidentNote, setAccidentNote] = useState('');
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [deleteNote, setDeleteNote] = useState('');
            const [customerToDelete, setCustomerToDelete] = useState(null);
            const [deletedCustomers, setDeletedCustomers] = useState(() => {
                const saved = localStorage.getItem('deletedCustomers');
                return saved ? JSON.parse(saved) : [];
            });
            const [expandedDeletedCustomer, setExpandedDeletedCustomer] = useState(null);
            const [deletedFilterDate, setDeletedFilterDate] = useState('');

            const [newUsername, setNewUsername] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [newName, setNewName] = useState('');
            const [newRole, setNewRole] = useState('staff');
            const [newAllowedBranches, setNewAllowedBranches] = useState([]);
            const [expandedCustomer, setExpandedCustomer] = useState(null);

            useEffect(() => {
                let timerInterval;
                if (startTime) {
                    timerInterval = setInterval(() => {
                        setElapsedTime(Math.floor((Date.now() - startTime) / 1000));
                    }, 1000);
                }
                return () => { if (timerInterval) clearInterval(timerInterval); };
            }, [startTime]);

            useEffect(() => {
                if (currentUser && !currentUser.allowedBranches.includes(selectedBranch)) {
                    setSelectedBranch(currentUser.allowedBranches[0]);
                }
            }, [currentUser, selectedBranch]);

            const handleLogin = () => {
                const user = users.find(u => u.username === loginUsername && u.password === loginPassword);
                if (user) {
                    if (user.status === 'suspended') { setLoginError('บัญชีนี้ถูกระงับการใช้งาน'); return; }
                    
                    setCurrentUser(user);
                    setIsLoggedIn(true);
                    setSelectedBranch(user.allowedBranches[0]);
                    
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    setLoginError(''); 
                    setLoginUsername(''); 
                    setLoginPassword('');
                } else { setLoginError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); }
            };

            const handleLogout = () => {
                setIsLoggedIn(false); 
                setCurrentUser(null); 
                setShowUserMenu(false); 
                setView('dashboard');
                
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
            };

            const handleAddUser = () => {
                if (!newUsername || !newPassword || !newName || newAllowedBranches.length === 0) {
                    alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return;
                }
                const newUser = {
                    id: Date.now(),
                    username: newUsername, password: newPassword, name: newName,
                    role: newRole, status: 'active', allowedBranches: newAllowedBranches
                };
                const updatedUsers = [...users, newUser];
                setUsers(updatedUsers);
                localStorage.setItem('users', JSON.stringify(updatedUsers));
                resetUserForm();
            };

            const handleEditClick = (user) => {
                setEditingUser(user);
                setNewName(user.name); setNewUsername(user.username);
                setNewPassword(user.password); setNewRole(user.role);
                setNewAllowedBranches(user.allowedBranches);
                setShowAddForm(true);
            };

            const handleUpdateUser = () => {
                const updatedUsers = users.map(u => u.id === editingUser.id ? { ...u, name: newName, username: newUsername, password: newPassword, role: newRole, allowedBranches: newAllowedBranches } : u);
                setUsers(updatedUsers);
                localStorage.setItem('users', JSON.stringify(updatedUsers));
                
                if (editingUser.id === currentUser.id) {
                    const updatedCurrentUser = { ...currentUser, name: newName, username: newUsername, password: newPassword, role: newRole, allowedBranches: newAllowedBranches };
                    setCurrentUser(updatedCurrentUser);
                    localStorage.setItem('currentUser', JSON.stringify(updatedCurrentUser));
                }
                
                resetUserForm();
            };

            const toggleUserStatus = (id) => {
                if (id === 1) return alert('ไม่สามารถระงับ Admin ได้');
                const updatedUsers = users.map(u => u.id === id ? { ...u, status: u.status === 'active' ? 'suspended' : 'active' } : u);
                setUsers(updatedUsers);
                localStorage.setItem('users', JSON.stringify(updatedUsers));
            };

            const deleteUser = (id) => {
                if (id === 1) return alert('ไม่สามารถลบ Admin ได้');
                if (confirm('ยืนยันการลบผู้ใช้?')) {
                    const updatedUsers = users.filter(u => u.id !== id);
                    setUsers(updatedUsers);
                    localStorage.setItem('users', JSON.stringify(updatedUsers));
                }
            };

            const resetUserForm = () => {
                setNewUsername(''); setNewPassword(''); setNewName('');
                setNewRole('staff'); setNewAllowedBranches([]);
                setEditingUser(null); setShowAddForm(false);
            };

            const toggleBranch = (branchCode) => {
                setNewAllowedBranches(prev => prev.includes(branchCode) ? prev.filter(b => b !== branchCode) : [...prev, branchCode]);
            };

            const getTodayString = () => {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const isSameDate = (timestamp, dateStr) => {
                const date = new Date(timestamp);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const dateOnlyStr = `${year}-${month}-${day}`;
                
                console.log('isSameDate check:', {
                    timestamp,
                    dateStr,
                    dateOnlyStr,
                    match: dateOnlyStr === dateStr
                });
                
                return dateOnlyStr === dateStr;
            };

            const getStats = () => {
                const today = getTodayString();
                const branchCustomers = customers.filter(c => {
                    const matchBranch = c.branch === selectedBranch;
                    const matchDate = isSameDate(c.registeredAt, today);
                    return matchBranch && matchDate;
                });
                
                console.log('Stats - Total customers:', customers.length);
                console.log('Stats - Branch customers:', branchCustomers.length);
                console.log('Stats - Selected branch:', selectedBranch);
                console.log('Stats - Today date:', today);
                
                return {
                    registered: branchCustomers.length,
                    waiting: branchCustomers.filter(c => c.status === 'waiting').length,
                    inService: branchCustomers.filter(c => c.status === 'in-service').length,
                    completed: branchCustomers.filter(c => c.status === 'completed').length,
                    accident: branchCustomers.filter(c => c.sessions?.some(s => s.status === 'accident')).length
                };
            };
            const stats = getStats();

            const registerCustomer = () => {
                if (!regHN || !regName || !regPhone) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
                
                const now = new Date();
                const todayStr = getTodayString();
                
                const newCustomer = {
                    hn: regHN, 
                    name: regName, 
                    phone: regPhone, 
                    status: 'waiting', 
                    branch: selectedBranch,
                    timestamp: now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                    registeredAt: now.getTime(),
                    registeredDate: todayStr,
                    sessions: []
                };
                
                const updatedCustomers = [...customers, newCustomer];
                setCustomers(updatedCustomers);
                localStorage.setItem('customers', JSON.stringify(updatedCustomers));
                
                console.log('=== NEW REGISTRATION ===');
                console.log('New customer:', newCustomer);
                console.log('Today string (getTodayString):', todayStr);
                console.log('registeredAt timestamp:', newCustomer.registeredAt);
                console.log('registeredAt as Date:', new Date(newCustomer.registeredAt));
                console.log('All customers after add:', updatedCustomers);
                
                setRegHN(''); 
                setRegName(''); 
                setRegPhone('');
                setShowSuccessModal(true);
                
                setTimeout(() => {
                    setShowSuccessModal(false);
                    setView('dashboard');
                }, 2000);
            };

            const startTracking = (customer) => { setView('selectProcedure'); setCurrentCustomer(customer); };

            const selectProcedure = (proc) => {
                const updatedCustomers = customers.map(c => c.hn === currentCustomer.hn ? {...c, status: 'in-service'} : c);
                setCustomers(updatedCustomers);
                localStorage.setItem('customers', JSON.stringify(updatedCustomers));
                setProcedure(proc); setView('tracking'); setCurrentSessionIndex(0); setSessions([]);
                setStartTime(null); setElapsedTime(0);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60); const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const startSession = () => { setStartTime(Date.now()); setElapsedTime(0); };

            const stopSession = () => {
                const currentPath = PROCEDURES[procedure];
                const newSession = {
                    session: currentPath[currentSessionIndex], startTime: new Date(startTime).toLocaleTimeString('th-TH'),
                    duration: formatTime(elapsedTime), note: note, status: 'completed'
                };
                const newSessions = [...sessions, newSession];
                if (currentSessionIndex < currentPath.length - 1) {
                    setSessions(newSessions); setCurrentSessionIndex(currentSessionIndex + 1); setStartTime(null); setElapsedTime(0); setNote('');
                } else {
                    const updatedCustomers = customers.map(c => c.hn === currentCustomer.hn ? {...c, status: 'completed', sessions: newSessions} : c);
                    setCustomers(updatedCustomers);
                    localStorage.setItem('customers', JSON.stringify(updatedCustomers));
                    setStartTime(null); setElapsedTime(0); setNote('');
                    setTimeout(() => { alert('บันทึกสำเร็จ!'); setView('dashboard'); resetTracking(); }, 100);
                }
            };

            const handleAccident = () => {
                if (!accidentNote.trim()) { 
                    alert('กรุณาระบุหมายเหตุ'); 
                    return; 
                }

                const newAccidentEntry = {
                    session: PROCEDURES[procedure][currentSessionIndex], 
                    startTime: new Date(startTime).toLocaleTimeString('th-TH'),
                    duration: formatTime(elapsedTime), 
                    note: `⚠️ ACCIDENT: ${accidentNote}`, 
                    status: 'accident'
                };

                const updatedSessions = [...sessions, newAccidentEntry];
                const updatedCustomers = customers.map(c => 
                    c.hn === currentCustomer.hn 
                        ? { ...c, status: 'completed', sessions: updatedSessions } 
                        : c
                );

                setCustomers(updatedCustomers);
                localStorage.setItem('customers', JSON.stringify(updatedCustomers));

                setShowAccidentModal(false);
                setAccidentNote('');
                setStartTime(null);
                setElapsedTime(0);
                
                setTimeout(() => { 
                    alert('บันทึก Accident สำเร็จ!'); 
                    setView('dashboard'); 
                    resetTracking(); 
                }, 100);
            };

            const deleteCustomer = (customer) => {
                setCustomerToDelete(customer);
                setShowDeleteModal(true);
            };

            const confirmDelete = () => {
                if (!deleteNote.trim()) {
                    alert('กรุณาระบุหมายเหตุการลบ');
                    return;
                }

                const deletedRecord = {
                    ...customerToDelete,
                    deletedAt: new Date().getTime(),
                    deletedDate: getTodayString(),
                    deleteNote: deleteNote,
                    deletedBy: currentUser.name
                };

                const updatedCustomers = customers.filter(c => c.hn !== customerToDelete.hn);
                const updatedDeletedCustomers = [...deletedCustomers, deletedRecord];

                setCustomers(updatedCustomers);
                setDeletedCustomers(updatedDeletedCustomers);
                localStorage.setItem('customers', JSON.stringify(updatedCustomers));
                localStorage.setItem('deletedCustomers', JSON.stringify(updatedDeletedCustomers));

                setShowDeleteModal(false);
                setDeleteNote('');
                setCustomerToDelete(null);
                setExpandedCustomer(null);
            };

            const restoreCustomer = (deletedCustomer) => {
                if (confirm('ยืนยันการกู้คืนข้อมูลลูกค้า?')) {
                    const { deletedAt, deletedDate, deleteNote, deletedBy, ...originalCustomer } = deletedCustomer;
                    
                    const updatedCustomers = [...customers, originalCustomer];
                    const updatedDeletedCustomers = deletedCustomers.filter(c => c.hn !== deletedCustomer.hn);

                    setCustomers(updatedCustomers);
                    setDeletedCustomers(updatedDeletedCustomers);
                    localStorage.setItem('customers', JSON.stringify(updatedCustomers));
                    localStorage.setItem('deletedCustomers', JSON.stringify(updatedDeletedCustomers));

                    alert('กู้คืนข้อมูลสำเร็จ!');
                }
            };

            const toggleCustomerDetails = (hn) => {
                if (expandedCustomer === hn) {
                    setExpandedCustomer(null);
                } else {
                    setExpandedCustomer(hn);
                }
            };

            const toggleDeletedCustomerDetails = (hn) => {
                if (expandedDeletedCustomer === hn) {
                    setExpandedDeletedCustomer(null);
                } else {
                    setExpandedDeletedCustomer(hn);
                }
            };

            const resetTracking = () => { setProcedure(''); setCurrentCustomer(null); setSessions([]); setCurrentSessionIndex(0); };
            const backToDashboard = () => { setView('dashboard'); };
            
            const getFilteredCustomers = () => {
                const today = getTodayString();
                let filtered = customers.filter(c => {
                    const matchBranch = c.branch === selectedBranch;
                    const matchDate = isSameDate(c.registeredAt, today);
                    console.log('Filter check:', {
                        customer: c.name,
                        branch: c.branch,
                        selectedBranch,
                        matchBranch,
                        registeredAt: new Date(c.registeredAt).toDateString(),
                        today: new Date(today + 'T00:00:00').toDateString(),
                        matchDate
                    });
                    return matchBranch && matchDate;
                });
                
                if (filterStatus === 'accident') {
                    filtered = filtered.filter(c => c.sessions?.some(s => s.status === 'accident'));
                } else if (filterStatus !== 'all') {
                    filtered = filtered.filter(c => c.status === filterStatus);
                }
                
                console.log('Filtered customers:', filtered);
                return filtered;
            };

            const getStatusColor = (status) => {
                switch(status) {
                    case 'waiting': return 'border-yellow-500 bg-yellow-50';
                    case 'in-service': return 'border-red-500 bg-red-50';
                    case 'completed': return 'border-green-500 bg-green-50';
                    default: return 'border-gray-500 bg-gray-50';
                }
            };

            const getStatusBadge = (status) => {
                switch(status) {
                    case 'waiting': return <span className="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-lg text-sm font-medium">รอคิว</span>;
                    case 'in-service': return <span className="px-3 py-1 bg-red-100 text-red-700 rounded-lg text-sm font-medium">กำลังรับบริการ</span>;
                    case 'completed': return <span className="px-3 py-1 bg-green-100 text-green-700 rounded-lg text-sm font-medium">เสร็จสิ้น</span>;
                    default: return null;
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-pink-100 to-pink-200 flex items-center justify-center">
                        <div className="bg-white rounded-3xl shadow-2xl p-12 w-full max-w-md">
                            <div className="text-center mb-8">
                                <div className="w-24 h-24 bg-gradient-to-br from-pink-400 to-pink-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <span className="text-white font-bold text-4xl">E</span>
                                </div>
                                <h1 className="text-3xl font-bold text-gray-900 mb-2">Emma Clinic</h1>
                                <p className="text-gray-600">Time Tracker</p>
                            </div>
                            <div className="space-y-5">
                                <div><label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                                <input type="text" value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} placeholder="กรอกชื่อผู้ใช้" className="w-full p-4 border-2 border-gray-200 rounded-xl focus:border-pink-500 focus:outline-none text-lg" /></div>
                                <div><label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} placeholder="กรอกรหัสผ่าน" className="w-full p-4 border-2 border-gray-200 rounded-xl focus:border-pink-500 focus:outline-none text-lg" /></div>
                                {loginError && <div className="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-xl text-sm">{loginError}</div>}
                                <button onClick={handleLogin} className="w-full py-4 bg-gradient-to-r from-pink-500 to-pink-600 text-white rounded-xl hover:from-pink-600 hover:to-pink-700 font-bold text-lg shadow-lg">เข้าสู่ระบบ</button>
                                <div className="text-center text-sm text-gray-500 mt-6">
                                  
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'dashboard') {
                const filteredCustomers = getFilteredCustomers();
                const branchName = BRANCHES.find(b => b.code === selectedBranch)?.name || 'แพรกษา';
                const allowedBranches = BRANCHES.filter(b => currentUser.allowedBranches.includes(b.code));
                const today = getTodayString();

                console.log('=== DASHBOARD RENDER ===');
                console.log('Total customers in state:', customers.length);
                console.log('Filtered customers:', filteredCustomers.length);
                console.log('Selected branch:', selectedBranch, branchName);
                console.log('Today date (using):', today);
                console.log('Filter status:', filterStatus);
                console.log('All customers:', customers);

                return (
                    <div className="min-h-screen bg-gray-50">
                        <div className="bg-white border-b shadow-sm">
                            <div className="max-w-7xl mx-auto px-6 py-4">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <div className="w-14 h-14 bg-gradient-to-br from-pink-400 to-pink-600 rounded-full flex items-center justify-center shadow-md">
                                            <span className="text-white font-bold text-xl">E</span>
                                        </div>
                                        <div>
                                            <h1 className="text-2xl font-bold text-gray-900">Emma Clinic</h1>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="flex items-center gap-2">
                                            <span className="text-sm text-gray-600 font-semibold">สาขา:</span>

                                                <div className="absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-xl border border-gray-200 py-2 z-50">
                                                    <div className="px-4 py-3 border-b border-gray-100"><p className="font-semibold text-gray-900">{currentUser.name}</p><p className="text-sm text-gray-600">@{currentUser.username}</p></div>

                                                            <button onClick={() => { setView('deleted'); setShowUserMenu(false); }} className="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-2 text-gray-700"><span>🗑️</span> ข้อมูลที่ถูกลบ</button>

                                                        </>
                                                    )}
