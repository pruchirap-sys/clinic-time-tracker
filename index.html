<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Emma Clinic - Time Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center">

<div class="bg-white p-6 rounded-xl shadow w-full max-w-md">
  <h1 class="text-xl font-bold text-center mb-4">Clinic Time Tracker</h1>

  <input id="branch" placeholder="สาขา" class="w-full border p-2 rounded mb-2">
  <input id="hn" placeholder="HN" class="w-full border p-2 rounded mb-2">
  <input id="name" placeholder="ชื่อลูกค้า" class="w-full border p-2 rounded mb-2">
  <input id="procedure" placeholder="หัตถการ" class="w-full border p-2 rounded mb-2">

  <select id="session" class="w-full border p-2 rounded mb-3">
    <option>Check-in</option>
    <option>คลีนซิ่ง</option>
    <option>ทำหัตถการ</option>
    <option>Check-out</option>
  </select>

  <div class="flex gap-2 mb-3">
    <button onclick="startSession()" class="flex-1 bg-green-500 text-white p-2 rounded">START</button>
    <button onclick="stopSession()" class="flex-1 bg-red-500 text-white p-2 rounded">STOP</button>
  </div>

  <button onclick="submitAll()" class="w-full bg-blue-600 text-white p-2 rounded">
    บันทึกทั้งหมด
  </button>

  <p id="status" class="text-center mt-2 text-sm"></p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhJvSH2NcWceeqhjBv2UZ1Ycz8-mTarmW2kE7fpJeqFu1_a2XcvBKx8MXO55BLjCcQ/exec";


let currentStart = null;
let sessions = [];

function startSession() {
  currentStart = new Date();
  status.innerText = "เริ่มจับเวลาแล้ว";
}

function stopSession() {
  if (!currentStart) return;

  const end = new Date();
  const duration = Math.round((end - currentStart) / 60000);

  sessions.push({
    session: session.value,
    startTime: currentStart.toLocaleTimeString(),
    duration: duration,
    status: "completed"
  });

  currentStart = null;
  status.innerText = "บันทึก session แล้ว";
}

function submitAll() {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "save_sessions",
      timestamp: new Date().toLocaleString('th-TH'),
      branch: branch.value,
      hn: hn.value,
      name: name.value,
      procedure: procedure.value,
      sessions: sessions
    })
  })
  .then(r => r.json())
  .then(() => {
    status.innerText = "บันทึกลงระบบเรียบร้อย";
    sessions = [];
  })
  .catch(() => {
    status.innerText = "เกิดข้อผิดพลาด";
  });
}
</script>

</body>
</html>
