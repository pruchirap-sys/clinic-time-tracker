<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Emma Clinic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<script>
const API = "https://script.google.com/macros/s/AKfycbxgWQ4j4BS5k__1mMiWUhBE-gQQrznV7nEogNWkdMAGbpFRsq7NoWUUShjIy31YmZEv/exec";

function post(data){
  const form = new URLSearchParams();
  Object.keys(data).forEach(k => form.append(k, data[k]));
  return fetch(API,{method:"POST",body:form}).then(r=>r.json());
}

function toast(msg){
  alert(msg); // เวอร์ชันง่าย เดี๋ยวค่อยอัปเป็น toast จริง
}

function load(){
  post({action:"get_customers"}).then(res=>{
    const w=[], s=[], d=[];
    res.customers.forEach(c=>{
      if(c.status==="waiting") w.push(c);
      if(c.status==="in-service") s.push(c);
      if(c.status==="completed") d.push(c);
    });

    wCount.innerText=w.length;
    sCount.innerText=s.length;
    dCount.innerText=d.length;

    waiting.innerHTML="";
    serving.innerHTML="";

    w.forEach(c=>{
      waiting.innerHTML+=`
        <div class="bg-white p-4 rounded-xl flex justify-between">
          <div>
            <b>${c.name}</b><div class="text-sm">HN ${c.hn}</div>
          </div>
          <button onclick="start('${c.hn}')" class="bg-green-500 text-white px-4 py-2 rounded-lg">
            เริ่มให้บริการ
          </button>
        </div>`;
    });

    s.forEach(c=>{
      serving.innerHTML+=`
        <div class="bg-white p-4 rounded-xl flex justify-between">
          <div>
            <b>${c.name}</b><div class="text-sm">HN ${c.hn}</div>
          </div>
          <button onclick="finish('${c.hn}')" class="bg-red-500 text-white px-4 py-2 rounded-lg">
            เสร็จสิ้น
          </button>
        </div>`;
    });
  });
}

function register(){
  post({
    action:"register",
    branch:branch.value,
    hn:hn.value,
    name:name.value,
    phone:phone.value
  }).then(()=>{
    toast("ลงทะเบียนเรียบร้อย");
    modal.classList.add("hidden");
    load();
  });
}

function start(hn){
  post({action:"update_status",hn,status:"in-service"}).then(load);
}

function finish(hn){
  post({action:"update_status",hn,status:"completed"}).then(load);
}

window.onload=load;
</script>

<!-- HEADER -->
<div class="bg-white p-4 flex justify-between shadow">
  <b>Emma Clinic</b>
  <button onclick="modal.classList.remove('hidden')" class="bg-red-500 text-white px-4 py-2 rounded-lg">
    ลงทะเบียน
  </button>
</div>

<!-- DASHBOARD -->
<div class="p-6 grid grid-cols-3 gap-4">
  <div class="bg-white p-4 rounded-xl text-center">รอ<br><b id="wCount">0</b></div>
  <div class="bg-white p-4 rounded-xl text-center">กำลังทำ<br><b id="sCount">0</b></div>
  <div class="bg-white p-4 rounded-xl text-center">เสร็จแล้ว<br><b id="dCount">0</b></div>
</div>

<!-- LISTS -->
<div class="p-6 grid grid-cols-2 gap-6">
  <div>
    <h3 class="mb-2">รอให้บริการ</h3>
    <div id="waiting" class="space-y-2"></div>
  </div>
  <div>
    <h3 class="mb-2">กำลังให้บริการ</h3>
    <div id="serving" class="space-y-2"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl w-96 space-y-3">
    <h3 class="font-bold">ลงทะเบียนลูกค้า</h3>
    <select id="branch" class="border p-2 w-full rounded">
      <option>แพรกษา</option>
      <option>อโศก</option>
    </select>
    <input id="hn" placeholder="HN" class="border p-2 w-full rounded">
    <input id="name" placeholder="ชื่อ" class="border p-2 w-full rounded">
    <input id="phone" placeholder="โทร" class="border p-2 w-full rounded">
    <div class="flex justify-end gap-2">
      <button onclick="modal.classList.add('hidden')">ยกเลิก</button>
      <button onclick="register()" class="bg-red-500 text-white px-4 py-2 rounded">
        บันทึก
      </button>
    </div>
  </div>
</div>

</body>
</html>
